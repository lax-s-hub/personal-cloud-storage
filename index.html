<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Cloud Storage</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">☁</div>
          <div>
            <div class="brand-title">Cloud Storage</div>
            <div class="brand-subtitle">Personal Drive</div>
          </div>
        </div>

        <button
          class="primary-btn"
          onclick="document.getElementById('uploadInput').click()"
        >
          Upload File
        </button>
        <button class="secondary-btn" onclick="createFolder()">
          New Folder
        </button>

        <input
          type="file"
          id="uploadInput"
          class="upload-input"
          onchange="handleFileSelect(event)"
        />

        <nav class="sidebar-nav">
          <div class="nav-label">Browse</div>

          <button
            class="nav-item active"
            onclick="
              setActiveTab(this);
              filterFiles('all');
            "
          >
            <span>My Drive</span>
          </button>

          <button
            class="nav-item"
            onclick="
              setActiveTab(this);
              sortFiles('recent');
            "
          >
            <span>Recent</span>
          </button>

          <button
            class="nav-item"
            onclick="
              setActiveTab(this);
              filterFiles('starred');
            "
          >
            <span>Starred</span>
          </button>

          <button
            class="nav-item"
            onclick="
              setActiveTab(this);
              loadTrash();
            "
          >
            <span>Trash</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <button class="ghost-btn" onclick="logout()">Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <h1 class="page-title">My Drive</h1>
            <p class="page-subtitle">
              Manage your files, folders, and storage in one place.
            </p>
          </div>

          <div class="topbar-actions">
            <div class="search-wrap">
              <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="Search files"
                oninput="searchFiles()"
                autocomplete="off"
              />
              <div id="searchSuggestions" class="search-suggestions"></div>
            </div>

            <select class="sort-select" onchange="sortFiles(this.value)">
              <option value="">Sort</option>
              <option value="recent">Recent</option>
              <option value="name">Name</option>
              <option value="size">Size</option>
            </select>

            <div class="view-toggle">
              <button
                class="view-btn active"
                title="List view"
                onclick="setView('list')"
              >
                ☰
              </button>
              <button
                class="view-btn"
                title="Grid view"
                onclick="setView('grid')"
              >
                ⊞
              </button>
            </div>
          </div>
        </header>

        <div id="status" class="status-message"></div>

        <section class="stats">
          <div class="stat-card">
            <div class="stat-label">Total Files</div>
            <div class="stat-value" id="totalFiles">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Storage Used</div>
            <div class="stat-value" id="storageUsed">0 MB</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div class="stat-value" id="status-indicator">Ready</div>
          </div>
        </section>

        <section class="folders-section">
          <div class="section-header">
            <h3>Folders</h3>
          </div>
          <div id="folderList" class="folder-list"></div>
        </section>

        <section class="files-section">
          <div class="section-header">
            <h3 id="currentFolderTitle">My Drive</h3>
          </div>
          <div id="fileList" class="file-list"></div>
        </section>
      </main>
    </div>

    <script>
      // let allFiles = [];
      let allFolders = [];
      let currentFolder = "My Drive";
      const token = localStorage.getItem("token");

      if (!token) {
        window.location.href = "/login.html";
      }
      function authFetch(url, options = {}) {
        const headers = {
          ...(options.headers || {}),
          Authorization: `Bearer ${token}`,
        };

        return fetch(url, {
          ...options,
          headers,
        });
      }
      function logout() {
        localStorage.removeItem("token");
        window.location.href = "/login.html";
      }
      let allFiles = [];

      // Show status
      function showStatus(message, type) {
        const status = document.getElementById("status");
        status.textContent = message;
        status.className = `status-message ${type}`;

        setTimeout(() => {
          status.className = "status-message";
        }, 4000);
      }

      // Handle file select
      function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;
        uploadFile(file);
      }

      // Upload file
      async function uploadFile(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
          const response = await authFetch("http://localhost:5000/api/upload", {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.success) {
            showStatus(`✅ ${file.name} uploaded`, "success");
            document.getElementById("uploadInput").value = "";
            loadFiles();
          } else {
            showStatus("❌ Upload failed", "error");
          }
        } catch (error) {
          showStatus(`❌ ${error.message}`, "error");
        }
      }

      // Load files
      async function loadFiles() {
        try {
          currentFolder = "My Drive";

          const res = await authFetch("http://localhost:5000/api/files");
          const data = await res.json();

          const fileList = document.getElementById("fileList");
          const totalFiles = document.getElementById("totalFiles");
          const storageUsed = document.getElementById("storageUsed");
          const currentFolderTitle =
            document.getElementById("currentFolderTitle");

          fileList.innerHTML = "";
          currentFolderTitle.textContent = "My Drive";

          if (!data.success || !data.files) {
            allFiles = [];
            renderFiles([]);
            totalFiles.textContent = "0";
            storageUsed.textContent = "0 MB";
            return;
          }

          allFiles = data.files.filter(
            (file) => !file.isDeleted && !file.isFolderPlaceholder,
          );

          totalFiles.textContent = data.totalFiles || allFiles.length;
          storageUsed.textContent =
            ((data.totalStorageUsed || 0) / (1024 * 1024)).toFixed(2) + " MB";

          renderFiles(
            allFiles.filter(
              (file) => (file.folderName || "My Drive") === "My Drive",
            ),
          );
          loadFolders();
        } catch (error) {
          console.error("Error loading files:", error);
          showStatus("❌ Error loading files", "error");
        }
      }

      async function loadFolders() {
        try {
          const res = await authFetch("http://localhost:5000/api/folders");
          const data = await res.json();

          if (!data.success || !data.folders) {
            allFolders = [];
            renderFolders([]);
            return;
          }

          allFolders = data.folders.filter(
            (name) => name && name !== "My Drive",
          );
          renderFolders(allFolders);
        } catch (error) {
          console.error("Error loading folders:", error);
          renderFolders([]);
        }
      }

      function renderFolders(folders) {
        const folderList = document.getElementById("folderList");

        if (!folders || folders.length === 0) {
          folderList.innerHTML = `<p style="color:#6b7280;">No folders created yet</p>`;
          return;
        }

        folderList.innerHTML = folders
          .map(
            (folder) => `
        <div class="folder-card ${currentFolder === folder ? "active" : ""}" onclick="openFolder('${folder.replace(/'/g, "\\'")}')">
          <div class="folder-icon">📁</div>
          <div class="folder-name">${folder}</div>
          <div class="folder-meta">Click to open</div>
        </div>
      `,
          )
          .join("");
      }

      function openFolder(folderName) {
        currentFolder = folderName;
        document.getElementById("currentFolderTitle").textContent = folderName;

        const folderFiles = allFiles.filter(
          (file) => (file.folderName || "My Drive") === folderName,
        );
        renderFiles(folderFiles);
        renderFolders(allFolders);
      }

      async function renameFile(fileId, oldName) {
        const newName = prompt("Enter new file name:", oldName);

        if (!newName || newName.trim() === "" || newName === oldName) {
          return;
        }

        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/rename/${fileId}`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ newName }),
            },
          );

          const data = await res.json();

          if (data.success) {
            showStatus("✅ File renamed", "success");
            loadFiles();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Rename failed", "error");
        }
      }

      // Render files
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text || "";
        return div.innerHTML;
      }

      function renderFiles(files) {
        const fileList = document.getElementById("fileList");
        const isGridView = fileList.classList.contains("grid-view");
        fileList.innerHTML = "";

        if (!files || files.length === 0) {
          fileList.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📁</div>
        <div class="empty-text">No files found</div>
        <div class="empty-subtext">Upload files or open another folder</div>
      </div>
    `;
          return;
        }

        files.forEach((file) => {
          const item = document.createElement("div");
          item.className = "file-item";

          const safeName = escapeHtml(file.originalName || "Untitled");
          const safeFolder = escapeHtml(file.folderName || "My Drive");
          const safeMime = escapeHtml(file.mimeType || "Unknown");
          const safeCreatedAt = file.createdAt
            ? new Date(file.createdAt).toLocaleString()
            : "Unknown date";

          const safeJsName = (file.originalName || "Untitled")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");
          const safeJsMime = (file.mimeType || "Unknown")
            .replace(/\\/g, "\\\\")
            .replace(/'/g, "\\'");

          item.innerHTML = `
      <div class="file-main">
        <div class="file-icon-wrap">
          <div class="file-icon">${getFileIcon(file.originalName)}</div>
        </div>

        <div class="file-info">
          <div class="file-top-row">
            <div class="file-name" title="${safeName}">${safeName}</div>
            <div class="file-badges">
              ${file.isStarred ? `<span class="mini-badge starred">Starred</span>` : ""}
              ${file.shared ? `<span class="mini-badge shared">Shared</span>` : ""}
            </div>
          </div>

          <div class="file-folder-line">📁 ${safeFolder}</div>

          <div class="file-meta">
            <span>${(file.size / 1024).toFixed(2)} KB</span>
            <span>•</span>
            <span>${safeMime}</span>
            <span>•</span>
            <span>${safeCreatedAt}</span>
          </div>
        </div>
      </div>

      <div class="file-actions">
        <button class="action-btn" onclick="toggleStar('${file._id}')" title="Star">
          ${file.isStarred ? "⭐" : "☆"}
        </button>
        <button class="action-btn" onclick="previewFile('${file._id}', '${safeJsName}', '${safeJsMime}')" title="Preview">
          👁️
        </button>
        <button class="action-btn" onclick="downloadFile('${file._id}', '${safeJsName}')" title="Download">
          ⬇️
        </button>
        <button class="action-btn" onclick="shareFile('${file._id}')" title="Share">
          🔗
        </button>
        <button class="action-btn" onclick="moveFile('${file._id}')" title="Move">
          📂
        </button>
        <button class="action-btn" onclick="renameFile('${file._id}', '${safeJsName}')" title="Rename">
          ✏️
        </button>
        <button class="action-btn delete-btn" onclick="deleteFile('${file._id}')" title="Delete">
          🗑️
        </button>
      </div>
    `;

          fileList.appendChild(item);
        });
      }
      async function shareFile(fileId) {
        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/share/${fileId}`,
            {
              method: "PUT",
            },
          );

          if (!res.ok) {
            const text = await res.text();
            console.error("Share error response:", text);
            showStatus("❌ Share route not working", "error");
            return;
          }

          const data = await res.json();

          if (data.success) {
            await navigator.clipboard.writeText(data.shareLink);
            showStatus("✅ Share link copied", "success");
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Share failed", "error");
        }
      }
      async function moveFile(fileId) {
        const folderName = prompt("Move to folder name:");
        if (!folderName || !folderName.trim()) return;

        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/move/${fileId}`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ folderName }),
            },
          );

          const data = await res.json();

          if (data.success) {
            showStatus("✅ File moved", "success");
            await loadFiles();
            await loadFolders();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Move failed", "error");
        }
      }

      // PREVIEW FILE - WORKING FUNCTION
      async function previewFile(fileId, fileName, mimeType = "") {
        console.log("preview", { fileName, mimeType });
        const cleanName = fileName.trim().toLowerCase();
        const ext = cleanName.includes(".") ? cleanName.split(".").pop() : "";

        const isImage =
          mimeType.startsWith("image/") ||
          ["jpg", "jpeg", "png", "gif", "webp", "bmp", "svg"].includes(ext);

        const isPdf = mimeType === "application/pdf" || ext === "pdf";

        const isText =
          mimeType.startsWith("text/") || ["txt", "csv", "json"].includes(ext);

        try {
          const res = await authFetch(
            `http://localhost:5000/api/view/${fileId}`,
          );

          if (!res.ok) {
            showStatus("❌ Preview failed", "error");
            return;
          }

          const blob = await res.blob();
          const blobUrl = URL.createObjectURL(blob);

          if (isImage) {
            const modal = document.createElement("div");
            modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      `;

            modal.innerHTML = `
        <div style="position: relative; max-width: 95vw; max-height: 95vh;">
          <img src="${blobUrl}" style="
            max-width:95vw;
            max-height:95vh;
            border-radius:8px;
            box-shadow:0 5px 40px rgba(0,0,0,0.5);
            object-fit: contain;
          ">
          <button id="closePreviewBtn" style="
            position:absolute;
            top:10px;
            right:10px;
            width:40px;
            height:40px;
            background:white;
            border:none;
            border-radius:50%;
            cursor:pointer;
            font-size:20px;
          ">✕</button>
        </div>
      `;

            document.body.appendChild(modal);

            document.getElementById("closePreviewBtn").onclick = function () {
              URL.revokeObjectURL(blobUrl);
              modal.remove();
            };

            return;
          }

          if (isPdf) {
            window.open(blobUrl, "_blank");
            return;
          }

          if (isText) {
            const text = await blob.text();

            const modal = document.createElement("div");
            modal.style.cssText = `
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 700px;
        width: 90%;
        max-height: 80vh;
        overflow: auto;
        z-index: 1000;
        box-shadow: 0 5px 40px rgba(0,0,0,0.3);
      `;

            modal.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
          <h3 style="font-size:18px;">${fileName}</h3>
          <button id="closeTextPreview" style="
            border:none;
            background:none;
            font-size:20px;
            cursor:pointer;
          ">✕</button>
        </div>
        <pre style="
          background:#f5f5f5;
          padding:15px;
          border-radius:4px;
          overflow:auto;
          max-height:60vh;
          font-size:12px;
          white-space:pre-wrap;
          word-break:break-word;
        ">${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre>
      `;

            document.body.appendChild(modal);

            document.getElementById("closeTextPreview").onclick = function () {
              URL.revokeObjectURL(blobUrl);
              modal.remove();
            };

            return;
          }

          URL.revokeObjectURL(blobUrl);
          showStatus("📥 Preview not supported for this file type", "error");
        } catch (error) {
          showStatus("❌ Preview failed", "error");
        }
      }

      async function uploadFile(file) {
        const formData = new FormData();
        formData.append("file", file);

        try {
          const xhr = new XMLHttpRequest();

          xhr.open("POST", "http://localhost:5000/api/upload");
          xhr.setRequestHeader("Authorization", `Bearer ${token}`);

          xhr.upload.onprogress = function (e) {
            if (e.lengthComputable) {
              const percent = Math.round((e.loaded / e.total) * 100);
              showStatus(`⬆️ Uploading ${percent}%`, "success");
            }
          };

          xhr.onload = function () {
            if (xhr.status === 200) {
              const data = JSON.parse(xhr.responseText);
              if (data.success) {
                showStatus(`✅ ${file.name} uploaded`, "success");
                document.getElementById("uploadInput").value = "";
                loadFiles();
              } else {
                showStatus("❌ Upload failed", "error");
              }
            } else {
              showStatus("❌ Upload failed", "error");
            }
          };

          xhr.onerror = function () {
            showStatus("❌ Upload error", "error");
          };

          xhr.send(formData);
        } catch (error) {
          showStatus(`❌ ${error.message}`, "error");
        }
      }

      async function downloadFile(fileId, fileName) {
        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/download/${fileId}`,
          );

          if (!res.ok) {
            alert("Download failed");
            return;
          }

          const blob = await res.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (error) {
          console.error("Download error:", error);
        }
      }

      // Delete file
      async function deleteFile(fileId) {
        try {
          const token = localStorage.getItem("token");

          const res = await fetch(`http://localhost:5000/api/files/${fileId}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await res.json();

          if (data.success) {
            alert("File deleted successfully");
            loadFiles();
          } else {
            alert(data.error || "Delete failed");
          }
        } catch (error) {
          console.error("Delete error:", error);
        }
      }

      async function loadTrash() {
        try {
          currentFolder = "Trash";
          document.getElementById("currentFolderTitle").textContent = "Trash";

          const res = await authFetch("http://localhost:5000/api/trash");
          const data = await res.json();

          if (!data.success || !data.files) {
            renderTrashFiles([]);
            return;
          }

          renderTrashFiles(data.files);
        } catch (error) {
          showStatus("❌ Error loading trash", "error");
        }
      }

      async function createFolder() {
        const folderName = prompt("Folder name:");
        if (!folderName || !folderName.trim()) return;

        try {
          const res = await authFetch("http://localhost:5000/api/folders", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ folderName }),
          });

          const data = await res.json();

          if (data.success) {
            showStatus("✅ Folder created", "success");
            await loadFolders();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Folder failed", "error");
        }
      }
      function setActiveTab(clickedItem) {
        document.querySelectorAll(".nav-item").forEach((item) => {
          item.classList.remove("active");
        });

        clickedItem.classList.add("active");
      }

      function renderTrashFiles(files) {
        const fileList = document.getElementById("fileList");
        fileList.innerHTML = "";

        if (files.length === 0) {
          fileList.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🗑️</div>
        <div class="empty-text">Trash is empty</div>
        <div class="empty-subtext">Deleted files will appear here</div>
      </div>
    `;
          return;
        }

        files.forEach((file) => {
          const item = document.createElement("div");
          item.className = "file-item";

          item.innerHTML = `
      <div class="file-icon">${getFileIcon(file.originalName)}</div>
      <div class="file-info">
        <div class="file-name">${file.originalName}</div>
        <div class="file-meta">
          Deleted: ${new Date(file.deletedAt).toLocaleString()}
        </div>
      </div>
      <div class="file-actions">
        <button class="action-btn" onclick="restoreFile('${file._id}')" title="Restore">♻️</button>
        <button class="action-btn delete-btn" onclick="permanentlyDeleteFile('${file._id}')" title="Delete Forever">❌</button>
      </div>
    `;

          fileList.appendChild(item);
        });
      }

      async function restoreFile(fileId) {
        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/restore/${fileId}`,
            {
              method: "PUT",
            },
          );

          const data = await res.json();

          if (data.success) {
            showStatus("✅ File restored", "success");
            loadTrash();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Restore failed", "error");
        }
      }

      async function permanentlyDeleteFile(fileId) {
        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/permanent/${fileId}`,
            {
              method: "DELETE",
            },
          );

          const data = await res.json();

          if (data.success) {
            showStatus("✅ File permanently deleted", "success");
            loadTrash();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Permanent delete failed", "error");
        }
      }

      async function toggleStar(fileId) {
        try {
          const res = await authFetch(
            `http://localhost:5000/api/files/star/${fileId}`,
            {
              method: "PUT",
            },
          );

          const data = await res.json();

          if (data.success) {
            showStatus(`✅ ${data.message}`, "success");
            loadFiles();
          } else {
            showStatus(`❌ ${data.error}`, "error");
          }
        } catch (error) {
          showStatus("❌ Star update failed", "error");
        }
      }

      // Search files
      function searchFiles() {
        const searchValue = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();

        const suggestionsBox = document.getElementById("searchSuggestions");

        if (!searchValue) {
          renderFiles(getCurrentVisibleFiles());
          suggestionsBox.style.display = "none";
          suggestionsBox.innerHTML = "";
          return;
        }

        const filteredFiles = getCurrentVisibleFiles().filter(
          (file) =>
            file.originalName &&
            file.originalName.toLowerCase().includes(searchValue),
        );

        renderFiles(filteredFiles);

        if (filteredFiles.length === 0) {
          suggestionsBox.style.display = "none";
          suggestionsBox.innerHTML = "";
          return;
        }

        suggestionsBox.innerHTML = filteredFiles
          .slice(0, 5)
          .map(
            (file) => `
        <div
          onclick="selectSuggestion('${file.originalName.replace(/'/g, "\\'")}')"
          style="padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f1f3f4;"
          onmouseover="this.style.background='#f8f9fa'"
          onmouseout="this.style.background='white'"
        >
          ${file.originalName}
        </div>
      `,
          )
          .join("");

        suggestionsBox.style.display = "block";
      }

      function selectSuggestion(fileName) {
        document.getElementById("searchInput").value = fileName;
        document.getElementById("searchSuggestions").style.display = "none";

        const filteredFiles = allFiles.filter(
          (file) => file.originalName && file.originalName === fileName,
        );

        renderFiles(filteredFiles);
      }

      document.addEventListener("click", function (e) {
        const input = document.getElementById("searchInput");
        const box = document.getElementById("searchSuggestions");

        if (!input.contains(e.target) && !box.contains(e.target)) {
          box.style.display = "none";
        }
      });

      function filterFiles(type) {
        document.getElementById("searchInput").value = "";
        const suggestionsBox = document.getElementById("searchSuggestions");
        suggestionsBox.style.display = "none";
        suggestionsBox.innerHTML = "";

        if (type === "all") {
          currentFolder = "My Drive";
          document.getElementById("currentFolderTitle").textContent =
            "My Drive";
          renderFiles(getCurrentVisibleFiles());
          renderFolders(allFolders);
        }

        if (type === "starred") {
          currentFolder = "Starred";
          document.getElementById("currentFolderTitle").textContent = "Starred";
          renderFiles(getCurrentVisibleFiles());
          renderFolders(allFolders);
        }
      }

      function getCurrentVisibleFiles() {
        if (currentFolder === "Starred") {
          return allFiles.filter((file) => file.isStarred && !file.isDeleted);
        }

        if (currentFolder === "My Drive") {
          return allFiles.filter(
            (file) => (file.folderName || "My Drive") === "My Drive",
          );
        }

        return allFiles.filter(
          (file) => (file.folderName || "My Drive") === currentFolder,
        );
      }

      function sortFiles(type) {
        let sortedFiles = [...getCurrentVisibleFiles()];

        if (type === "recent") {
          sortedFiles.sort(
            (a, b) => new Date(b.createdAt) - new Date(a.createdAt),
          );
        } else if (type === "name") {
          sortedFiles.sort((a, b) =>
            a.originalName.localeCompare(b.originalName),
          );
        } else if (type === "size") {
          sortedFiles.sort((a, b) => b.size - a.size);
        }

        renderFiles(sortedFiles);
      }
      // Get file icon
      function getFileIcon(filename) {
        const ext = filename.split(".").pop().toLowerCase();
        const icons = {
          pdf: "📄",
          doc: "📝",
          docx: "📝",
          xls: "📊",
          xlsx: "📊",
          jpg: "🖼️",
          jpeg: "🖼️",
          png: "🖼️",
          gif: "🖼️",
          mp4: "🎬",
          avi: "🎬",
          mov: "🎬",
          mp3: "🎵",
          wav: "🎵",
          zip: "📦",
          rar: "📦",
          "7z": "📦",
          txt: "📄",
          csv: "📊",
        };
        return icons[ext] || "📎";
      }

      // Set view
      function setView(view) {
        const fileList = document.getElementById("fileList");
        const buttons = document.querySelectorAll(".view-btn");

        buttons.forEach((btn) => btn.classList.remove("active"));

        if (view === "list") {
          buttons[0].classList.add("active");
          fileList.classList.remove("grid-view");
        }

        if (view === "grid") {
          buttons[1].classList.add("active");
          fileList.classList.add("grid-view");
        }
      }

      // Load files on start
      loadFiles();

      // Drag and drop
      document.addEventListener("dragover", (e) => {
        e.preventDefault();
        document.querySelector(".main-content").style.background = "#f0f7ff";
      });

      document.addEventListener("dragleave", () => {
        document.querySelector(".main-content").style.background = "#f8f9fa";
      });

      document.addEventListener("drop", (e) => {
        e.preventDefault();
        document.querySelector(".main-content").style.background = "#f8f9fa";
        const files = e.dataTransfer.files;
        if (files.length > 0) {
          uploadFile(files[0]);
        }
      });
    </script>
  </body>
</html>
