<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - CloudStore</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 400px;
      }

      .logo {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: #667eea;
        margin-bottom: 10px;
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #333;
        font-size: 24px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 500;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 14px;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
      }

      .btn-signup {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: opacity 0.3s;
        margin-top: 20px;
      }

      .btn-signup:hover {
        opacity: 0.9;
      }

      .terms {
        font-size: 12px;
        color: #666;
        margin-top: 15px;
        line-height: 1.6;
      }

      .login-link {
        text-align: center;
        margin-top: 20px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
      }

      .login-link p {
        color: #666;
        font-size: 14px;
      }

      .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: bold;
      }

      .login-link a:hover {
        text-decoration: underline;
      }

      /* Modern Demo Styles */
      .demo-divider {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 20px 0;
        color: #aaa;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .demo-divider::before,
      .demo-divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid #eee;
      }

      .demo-divider:not(:empty)::before {
        margin-right: 1em;
      }
      .demo-divider:not(:empty)::after {
        margin-left: 1em;
      }

      .demo-actions {
        text-align: center;
      }

      .btn-guest {
        width: 100%;
        padding: 12px;
        background-color: #f8fafc;
        color: #475569;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .btn-guest:hover {
        background-color: #f1f5f9;
        color: #1e293b;
        border-color: #94a3b8;
      }

      .demo-hint {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 8px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🌥️ CloudStore</div>
      <h1>Create Account</h1>

      <form onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            required
            placeholder="John Doe"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your@email.com"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            placeholder="••••••••"
            minlength="6"
          />
        </div>

        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input
            type="password"
            id="confirm"
            name="confirm"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="terms">
          <input type="checkbox" required /> I agree to the Terms of Service and
          Privacy Policy
        </div>

        <button type="submit" class="btn-signup">Create Account</button>
      </form>

      <div class="login-link">
        <p>Already have an account? <a href="login.html">Sign in here</a></p>
      </div>
    </div>

    <script>
      async function handleSignup(event) {
        event.preventDefault();

        const name = document.getElementById("fullname").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
          const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ name, email, password }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("Signup successful");
            window.location.href = "/login.html";
          } else {
            alert(data.message);
          }
        } catch (error) {
          alert("Something went wrong");
        }
      }
    </script>
  </body>
</html>
